name: AnimeAv1 HLS sync probe

on:
  push:
    branches:
      - 'fix/animeav1-hls-download-sync'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: HLS sync probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Check the tools
        run: |
          set -euo pipefail
          ffmpeg -version | head -1
          python3 --version

      - name: Run the probe
        run: python3 .github/scripts/probe_animeav1_hls.py "$GITHUB_WORKSPACE"
